  <text x="48" y="64" fill="#8ca97f" font-size="18" font-family="Georgia, serif">PLACEHOLDER — replace this file</text><text x="48" y="130" fill="#e8ebe4" font-size="36" font-family="Georgia, serif">Hero — dusk street with cameras</text><text x="48" y="190" fill="#c5d0c4" font-size="22" font-family="Georgia, serif">Wide cinematic still, like Flock Safety’s homepage video.</text><text x="48" y="224" fill="#c5d0c4" font-size="22" font-family="Georgia, serif">Residential street at dusk, wet asphalt, warm window lights.</text><text x="48" y="258" fill="#c5d0c4" font-size="22" font-family="Georgia, serif">White boxy license-plate cameras on metal poles, left and right.</text><text x="48" y="292" fill="#c5d0c4" font-size="22" font-family="Georgia, serif">No people in close-up. Slight lens flare. 16:9 or wider.</text>
</svg>
